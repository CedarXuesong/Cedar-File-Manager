<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>屏幕刷新率 - 下拉栏动效</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, "Microsoft YaHei", sans-serif; background: #090909; color: #f5f5f5; letter-spacing: 0; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    button { font: inherit; color: inherit; cursor: pointer; }
    .stage { min-height: 100dvh; display: flex; justify-content: center; background: #090909; }
    .screen { position: relative; width: min(100%, 430px); aspect-ratio: 1280 / 2772; overflow: hidden; background: #090909; flex: none; }
    .canvas { position: absolute; width: 1280px; height: 2772px; transform-origin: top left; background: #090909; }

    .status { position: absolute; left: 89px; top: 40px; right: 89px; height: 90px; display: flex; align-items: center; justify-content: space-between; font-size: 43px; font-weight: 650; }
    .status-right { font-size: 32px; white-space: nowrap; }
    .battery { display: inline-block; padding: 0 8px; border-radius: 12px; color: white; background: #04af36; font-weight: 800; }
    .back { position: absolute; left: 38px; top: 171px; width: 141px; height: 140px; border: 0; background: transparent; text-align: left; padding: 0 23px; font-family: Arial, sans-serif; font-weight: 200; font-size: 100px; line-height: 105px; }
    h1 { position: absolute; left: 89px; top: 350px; margin: 0; font-size: 86px; line-height: 136px; font-weight: 600; }

    .selector { position: absolute; left: 38px; top: 546px; width: 1204px; height: 358px; display: flex; overflow: hidden; border-radius: 58px; }
    .selector-half { position: relative; width: 50%; height: 100%; }
    .selector-half.standard { background: #ffca57; }
    .selector-half.high { background: #02bfa0; }
    .selector-half.high::after { content: ""; position: absolute; left: 50px; top: 145px; width: 110px; height: 110px; border-radius: 50%; background: radial-gradient(circle at 42% 35%, #ecfff9, #97efcf 65%, #67dab8); opacity: .9; animation: drift 3.8s ease-in-out infinite alternate; }
    @keyframes drift { to { transform: translate(245px, -65px) scale(.7); opacity: .45; } }
    .selector-half span { position: absolute; right: 43px; bottom: 44px; font-size: 50px; font-weight: 600; }
    .description { position: absolute; left: 89px; top: 938px; width: 1102px; margin: 0; color: #969696; font-size: 40px; line-height: 55px; }

    .default-row, .custom-group { position: absolute; left: 38px; width: 1204px; border-radius: 57px; background: #282828; overflow: hidden; }
    .default-row { top: 1075px; height: 283px; border: 0; text-align: left; padding: 0 51px; }
    .default-row .title { position: absolute; top: 45px; left: 51px; font-size: 52px; }
    .default-row .sub { position: absolute; top: 121px; left: 51px; width: 1000px; color: #9b9b9b; font-size: 40px; line-height: 57px; }
    .radio { position: absolute; right: 69px; top: 102px; width: 65px; height: 65px; border: 5px solid #898989; border-radius: 50%; }
    .radio.checked { border-color: #5b9bff; }
    .radio.checked::after { content: ""; position: absolute; inset: 12px; border-radius: 50%; background: #5b9bff; }
    .custom-group { top: 1397px; height: 685px; }
    .custom-head { position: absolute; left: 51px; right: 51px; top: 0; height: 223px; }
    .custom-head .title { position: absolute; top: 43px; left: 0; font-size: 52px; color: #5b9bff; }
    .custom-head .sub { position: absolute; top: 119px; left: 0; font-size: 40px; color: #5b9bff; }
    .custom-head .mark { position: absolute; top: 53px; right: 16px; color: #5b9bff; font-size: 72px; line-height: 1; }
    .refresh-row { position: absolute; left: 0; top: 223px; width: 100%; height: 179px; border: 0; background: #383838; display: flex; align-items: center; justify-content: space-between; padding: 0 51px; text-align: left; font-size: 52px; }
    .refresh-value { color: #a7a7a7; display: flex; align-items: center; gap: 23px; font-size: 44px; }
    .chevrons { color: #999; font-size: 45px; line-height: .48; transform: translateY(-8px); }
    .apps-row { position: absolute; top: 402px; left: 51px; right: 51px; height: 283px; padding-top: 46px; }
    .apps-row .title { font-size: 52px; }
    .apps-row .sub { display: block; color: #969696; font-size: 40px; line-height: 57px; margin-top: 8px; }
    .apps-row .arrow { position: absolute; right: 0; top: 94px; color: #929292; font-size: 75px; font-weight: 200; }
    .footnote { position: absolute; top: 2146px; left: 89px; width: 1102px; color: #949494; font-size: 39px; line-height: 56px; }
    .nav-pill { position: absolute; bottom: 21px; left: 430px; width: 420px; height: 15px; border-radius: 15px; background: #aaa; }

    .scrim { position: absolute; inset: 0; z-index: 2; background: transparent; }
    .popup { position: absolute; left: 553px; top: 1665px; z-index: 3; width: 638px; height: 475px; overflow: hidden; border: 2px solid rgb(255 255 255 / 9%); border-radius: 60px; background: rgb(44 44 44 / 90%); backdrop-filter: blur(46px) saturate(1.15); -webkit-backdrop-filter: blur(46px) saturate(1.15); box-shadow: 0 26px 65px rgb(0 0 0 / 30%); filter: blur(0px); opacity: 0; visibility: hidden; will-change: left, top, width, height, opacity, filter; }
    .popup-content { position: absolute; left: -2px; top: -2px; width: 638px; height: 475px; padding: 26px 0; }
    .option { width: 100%; height: 141px; border: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 61px 0 64px; background: transparent; text-align: left; font-size: 50px; }
    .option:hover { background: rgb(255 255 255 / 5%); }
    .option.selected { color: #5b9bff; }
    .check { font-size: 60px; font-weight: 300; line-height: 1; }
    .refresh-row:focus-visible, .option:focus-visible { outline: 5px solid #5b9bff; outline-offset: -8px; }
    @media (prefers-reduced-motion: reduce) { .selector-half.high::after { animation: none; } }
  </style>
</head>
<body>
  <main class="stage">
    <div class="screen" id="screen">
      <div class="canvas" id="canvas">
        <div class="status"><span>17:31 ◉ ···</span><span class="status-right">▴ 5G ▂▅  Wi-Fi <span class="battery">100</span>ϟ</span></div>
        <button class="back" type="button" aria-label="返回" id="back">‹</button>
        <h1>屏幕刷新率</h1>
        <div class="selector"><div class="selector-half standard"><span>标准</span></div><div class="selector-half high"><span>高刷</span></div></div>
        <p class="description">高刷新率会让屏幕上的动态显示更加流畅，但也会增加一定电量消耗</p>
        <button class="default-row" type="button" id="defaultRow"><span class="title">默认（推荐）</span><span class="sub">根据显示场景动态选择最优刷新率，平衡流畅度与电量消耗</span><span class="radio" id="defaultRadio"></span></button>
        <div class="custom-group">
          <div class="custom-head"><span class="title" id="customTitle">自定义</span><span class="sub" id="customSub">优先以设定值刷新屏幕</span><span class="mark" id="customMark">✓</span></div>
          <button class="refresh-row" id="trigger" type="button" aria-haspopup="listbox" aria-expanded="false"><span>刷新率</span><span class="refresh-value"><span id="value">120 Hz</span><span class="chevrons">⌃<br>⌄</span></span></button>
          <div class="apps-row"><span class="title">使用高刷新率的应用</span><span class="sub">开启的应用刷新率最高可到120Hz，可以根据设备使用偏好自动选择合适的刷新率</span><span class="arrow">›</span></div>
        </div>
        <div class="footnote">1.为表明差异，对图示进行了慢速播放处理，实际以真实使用效果为准<br>2.屏幕刷新率会根据显示内容有部分动态调整</div>
        <div class="nav-pill"></div>
        <div class="scrim" id="scrim" hidden></div>
        <div class="popup" id="popup" role="listbox" aria-label="刷新率" aria-hidden="true">
          <div class="popup-content">
            <button class="option" type="button" role="option" aria-selected="false" data-value="60 Hz"><span>60 Hz</span><span class="check"></span></button>
            <button class="option" type="button" role="option" aria-selected="false" data-value="90 Hz"><span>90 Hz</span><span class="check"></span></button>
            <button class="option selected" type="button" role="option" aria-selected="true" data-value="120 Hz"><span>120 Hz</span><span class="check">✓</span></button>
          </div>
        </div>
      </div>
    </div>
  </main>
  <script>
    const screen = document.getElementById('screen');
    const canvas = document.getElementById('canvas');
    const popup = document.getElementById('popup');
    const scrim = document.getElementById('scrim');
    const trigger = document.getElementById('trigger');
    const value = document.getElementById('value');
    const options = [...popup.querySelectorAll('.option')];

    const settled = [553, 1665, 1191, 2140];
    const anchor = [751, 1665, 1191, 1753];
    const openFrames = [
      [0, ...anchor], [62, 638, 1731, 1163, 1959], [70, 626, 1733, 1163, 1984],
      [78, 614, 1733, 1162, 2006], [87, 605, 1730, 1164, 2025],
      [96, 596, 1727, 1165, 2043], [104, 588, 1722, 1166, 2058],
      [112, 582, 1718, 1169, 2073], [121, 576, 1712, 1170, 2084],
      [130, 572, 1706, 1173, 2094], [137, 569, 1701, 1176, 2103],
      [145, 566, 1695, 1179, 2110], [153, 563, 1689, 1181, 2115],
      [162, 561, 1684, 1183, 2120], [170, 560, 1680, 1185, 2125],
      [184, 558, 1676, 1186, 2128], [194, 556, 1670, 1189, 2134],
      [204, 555, 1668, 1190, 2136], [211, 554, 1666, 1190, 2138],
      [220, ...settled], [260, 552, 1662, 1190, 2137],
      [275, 552, 1661, 1190, 2136], [305, 552, 1662, 1190, 2137],
      [360, ...settled],
    ];
    const closeFrames = [
      [0, ...settled], [16, 588, 1702, 1176, 2060], [23, 604, 1713, 1172, 2027],
      [33, 620, 1722, 1168, 1995], [47, 650, 1732, 1162, 1937],
      [58, 664, 1733, 1161, 1911], [71, 688, 1730, 1161, 1868],
      [80, 698, 1726, 1162, 1850], [90, 707, 1722, 1164, 1835],
      [104, 721, 1711, 1167, 1809], [113, 727, 1706, 1170, 1799],
      [121, 731, 1702, 1172, 1791], [130, 735, 1695, 1175, 1783],
      [138, 737, 1690, 1177, 1778], [147, 740, 1685, 1180, 1773],
      [155, 742, 1681, 1182, 1769], [163, 744, 1677, 1184, 1765],
      [173, 746, 1674, 1186, 1762], [180, 747, 1671, 1187, 1759],
      [188, 748, 1669, 1188, 1757], [197, ...anchor], [212, ...anchor],
    ];

    let rect = anchor.slice();
    let target = 0;
    let frameId = 0;
    let selected = '120 Hz';

    function scaleScreen() {
      canvas.style.transform = `scale(${screen.clientWidth / 1280})`;
    }

    function interpolate(frames, ms) {
      if (ms <= 0) return frames[0].slice(1);
      for (let i = 1; i < frames.length; i++) {
        if (ms <= frames[i][0]) {
          const a = frames[i - 1];
          const b = frames[i];
          const t = (ms - a[0]) / (b[0] - a[0]);
          return [1, 2, 3, 4].map(j => a[j] + (b[j] - a[j]) * t);
        }
      }
      return frames.at(-1).slice(1);
    }

    function paint(bounds, visibility, blur) {
      rect = bounds;
      const [left, top, right, bottom] = bounds;
      popup.style.left = `${left}px`;
      popup.style.top = `${top}px`;
      popup.style.width = `${right - left}px`;
      popup.style.height = `${bottom - top}px`;
      popup.style.opacity = String(visibility);
      popup.style.filter = `blur(${blur}px)`;
    }

    function animate(open) {
      cancelAnimationFrame(frameId);
      const frames = open ? openFrames : closeFrames;
      const initial = rect.slice();
      const base = frames[0].slice(1);
      const duration = frames.at(-1)[0];
      const start = performance.now();
      target = Number(open);
      if (open) {
        scrim.hidden = false;
        popup.style.visibility = 'visible';
        popup.setAttribute('aria-hidden', 'false');
        trigger.setAttribute('aria-expanded', 'true');
      }
      function tick(now) {
        const elapsed = Math.min(duration, now - start);
        const position = interpolate(frames, elapsed);
        const correction = Math.pow(1 - elapsed / duration, 2);
        const bounds = position.map((coordinate, i) => coordinate + (initial[i] - base[i]) * correction);
        const visibility = open ? Math.min(1, elapsed / 75) : Math.min(1, (duration - elapsed) / 52);
        const blur = open
          ? 42 * Math.pow(Math.max(0, 1 - elapsed / 220), 1.4)
          : 36 * Math.pow(Math.min(1, elapsed / 185), 1.3);
        paint(bounds, visibility, blur);
        if (elapsed < duration) frameId = requestAnimationFrame(tick);
        else if (!open) {
          popup.style.visibility = 'hidden';
          popup.setAttribute('aria-hidden', 'true');
          trigger.setAttribute('aria-expanded', 'false');
          scrim.hidden = true;
        }
      }
      frameId = requestAnimationFrame(tick);
    }

    trigger.addEventListener('click', () => animate(!target));
    scrim.addEventListener('click', () => { if (target) animate(false); });
    document.getElementById('back').addEventListener('click', () => { if (target) animate(false); });
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape' && target) { animate(false); trigger.focus(); }
    });
    popup.addEventListener('click', event => {
      const option = event.target.closest('.option');
      if (!option || !target) return;
      selected = option.dataset.value;
      value.textContent = selected;
      for (const item of options) {
        const active = item === option;
        item.classList.toggle('selected', active);
        item.setAttribute('aria-selected', String(active));
        item.querySelector('.check').textContent = active ? '✓' : '';
      }
      animate(false);
    });
    document.getElementById('defaultRow').addEventListener('click', () => {
      if (target) animate(false);
      document.getElementById('defaultRadio').classList.add('checked');
      document.getElementById('customTitle').style.color = '#f5f5f5';
      document.getElementById('customSub').style.color = '#969696';
      document.getElementById('customMark').hidden = true;
    });
    trigger.addEventListener('click', () => {
      document.getElementById('defaultRadio').classList.remove('checked');
      document.getElementById('customTitle').style.color = '#5b9bff';
      document.getElementById('customSub').style.color = '#5b9bff';
      document.getElementById('customMark').hidden = false;
    });
    window.addEventListener('resize', scaleScreen);
    scaleScreen();
    paint(anchor, 0, 0);
  </script>
</body>
</html>
